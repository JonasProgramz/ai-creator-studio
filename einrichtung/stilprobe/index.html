<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>stilprobe</title>
  <link rel="stylesheet" href="assets/studio.css">
  <link rel="stylesheet" href="assets/tokens.css">
  <style>
    /* Stilprobe für die Einrichtung: Grund, Farben und Schriften eines Designs in einem Standbild.
       Bewusst keine fertigen Bausteine, nur das Material, aus dem später jede Szene neu gebaut wird. Präfix sp-. */
    .sp-titel { position: absolute; left: 96px; top: 96px; font: 800 92px/1.02 Text; letter-spacing: -.03em; color: var(--ink); }
    .sp-titel em { font-style: normal; color: var(--akzent); }
    .sp-unter { position: absolute; left: 100px; top: 214px; max-width: 900px; font: 500 30px/1.4 Text; color: var(--ink-soft); }
    .sp-zahl { position: absolute; left: 92px; top: 330px; font: 700 260px/1 Zahl; letter-spacing: -.02em; color: var(--ink); }
    .sp-zahl small { font: 600 40px Text; color: var(--ink-mute); margin-left: 12px; }
    .sp-mono { position: absolute; left: 100px; top: 640px; font: 500 30px/1.5 Mono; color: var(--ink-soft); }
    .sp-mono b { color: var(--akzent); font-weight: 700; }
    .sp-flaeche { position: absolute; border-radius: 26px; padding: 34px 40px; box-shadow: 0 3px 8px rgba(0,0,0,.35), 0 40px 80px -24px rgba(0,0,0,.7); }
    .sp-flaeche small { display: block; font: 700 18px Text; letter-spacing: .14em; text-transform: uppercase; opacity: .7; }
    .sp-flaeche b { display: block; margin-top: 12px; font: 700 40px/1.15 Text; letter-spacing: -.01em; }
    .sp-papier { left: 980px; top: 120px; width: 500px; height: 250px; background: var(--paper); color: var(--p-ink); }
    .sp-blatt { left: 980px; top: 410px; width: 500px; height: 250px; background: var(--sheet); color: var(--sheet-ink); }
    .sp-farben { position: absolute; left: 100px; top: 760px; display: flex; gap: 14px; }
    .sp-farben i { width: 120px; height: 56px; border-radius: 14px; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.12); }
    .sp-cam { position: absolute; right: 40px; bottom: 40px; width: 336px; height: 448px; border-radius: 24px; background: linear-gradient(160deg, #5b5f66, #2d3036);
      box-shadow: 0 3px 8px rgba(0,0,0,.4), 0 30px 60px -16px rgba(0,0,0,.6); display: grid; place-items: center; color: rgba(255,255,255,.7); font: 600 22px Text; }
    .sp-name { position: absolute; left: 100px; bottom: 44px; font: 500 20px Mono; color: var(--ink-mute); }
  </style>
</head>
<body>
<main id="root" data-composition-id="stilprobe" data-start="0" data-duration="1" data-width="1920" data-height="1080" data-fps="30">
  <div id="ground"><div class="muster"></div><div class="warm"></div><div class="cone"></div><div class="vig"></div></div>
  <div class="sp-titel">Schrift und <em>Akzent</em></div>
  <div class="sp-unter">Grund, Flächen, Farben und Schriften dieses Designs.</div>
  <div class="sp-zahl">72<small>%</small></div>
  <div class="sp-mono"><b>&gt;</b> fasse die notizen zusammen</div>
  <div class="sp-flaeche sp-papier"><small>Helle Fläche</small><b>Text auf Papier</b></div>
  <div class="sp-flaeche sp-blatt"><small>Farbige Fläche</small><b>Text auf Fläche</b></div>
  <div class="sp-farben"><i style="background:var(--akzent)"></i><i style="background:var(--akzent-tief)"></i><i style="background:var(--sheet)"></i><i style="background:var(--paper)"></i></div>
  <div class="sp-cam">Kamera</div>
  <div class="sp-name" id="sp-name">Grundstil</div>
  <script src="assets/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true }); tl.to({}, { duration: 1 });
    window.__timelines = window.__timelines || {}; window.__timelines['stilprobe'] = tl;
  </script>
</main>
</body>
</html>
