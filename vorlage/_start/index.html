<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>__ID__</title>
  <link rel="stylesheet" href="assets/studio.css">
  <link rel="stylesheet" href="assets/tokens.css">
  <style>
    /* Alles, was dieser Teil zeigt, baust du hier selbst. Farben und Schriften aus tokens.css (Profil),
       Schriftfamilien Text, Zahl, Mono. Für eine nachgebaute App ihre eigene Schrift per @font-face ergänzen. */
  </style>
</head>
<body>
<main id="root" data-composition-id="__ID__" data-start="0" data-duration="__DAUER__" data-width="1920" data-height="1080" data-fps="__FPS__">
  <div id="ground"><div class="muster"></div><div class="warm"></div><div class="cone"></div><div class="vig"></div></div>

  <!-- Szenen dieses Teils -->

  <div id="cam">
    <div id="camframe"></div>
    <div id="camclip"><div id="camvid"><video id="v" src="media/cam.mp4" data-start="0" data-duration="__DAUER__" data-track-index="0" muted playsinline></video></div></div>
  </div>
  <audio id="a" src="media/cam.mp4" data-start="0" data-duration="__DAUER__" data-track-index="1" data-volume="1"></audio>

  <script src="assets/gsap.min.js"></script>
  <script src="assets/kopf.js"></script>
  <script src="assets/studio.js"></script>
  <script>
    // Zeitachse sind die Wörter in worte.txt. Alle Aufrufe in zeitlicher Reihenfolge.
    // cam: Startzustand der Kamera. grund: wandernder Hintergrund mit Lichtkegel, false für einen eigenen Hintergrund.
    const B = makeStudio('__ID__', __DAUER__, { cam: 'klein_ur', grund: true }), tl = B.tl;

    B.done();
    window.__timelines = window.__timelines || {};
    window.__timelines['__ID__'] = tl;
  </script>
</main>
</body>
</html>
